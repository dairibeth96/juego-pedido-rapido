name: Compile APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: build android release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paquete-apk
          path: bin/*.apk