name: Compile APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Pre-accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          echo "24333f8543b98582fcc70620800b668d9f5uv356" > ~/.android/repository.cfg
          ANDROID_HOME=$HOME/.android
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n8933bac1631e8fa2101fd51e44f84183d2946c14" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n24333f8543b98582fcc70620800b668d9f5uv356" >> $ANDROID_HOME/licenses/android-sdk-license

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paquete-apk
          path: bin/*.apk